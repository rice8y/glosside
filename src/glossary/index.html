<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>用語集 - Glosside</title>
    <link rel="icon" type="image/png" href="../icons/48.png" />
    <link rel="stylesheet" href="../ui/app.css" />
    <link rel="stylesheet" href="glossary.css" />
    <script type="module" src="index.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="../icons/glosside.svg" width="30" height="30" alt="" /><strong>Glosside</strong>
        </div>
        <h1>用語集</h1>
      </header>
      <p id="error" role="alert" hidden></p>
      <section id="library">
        <fieldset id="library-fields" disabled>
          <div class="toolbar">
            <button id="create" type="button">＋ 用語集を作成</button>
          </div>
          <div class="library-head" aria-hidden="true">
            <span>用語集名</span><span>説明</span><span>用語数</span>
          </div>
          <div id="collections"></div>
          <p id="library-empty" hidden>用語集はまだありません。</p>
        </fieldset>
      </section>
      <form id="editor" hidden>
        <fieldset id="fields" disabled>
          <button id="back" type="button" class="back">← 用語集一覧</button>
          <div class="metadata">
            <label for="name">用語集名<input id="name" maxlength="100" required /></label>
            <label for="description"
              >説明（任意）<textarea id="description" rows="2" maxlength="500"></textarea>
            </label>
          </div>
          <div class="toolbar">
            <span id="count">0 / 100</span><button id="add" type="button">＋ 用語を追加</button>
          </div>
          <div class="column-head" aria-hidden="true">
            <span>用語</span><span>訳語</span><span></span>
          </div>
          <div id="rows"></div>
          <p id="empty" hidden>用語はまだ登録されていません。</p>
        </fieldset>

        <div class="actions">
          <button id="delete" type="button" class="danger">用語集を削除</button
          ><button id="reset" type="button" disabled>変更を破棄</button
          ><button id="save" class="primary" type="submit" disabled>保存</button>
        </div>
      </form>
      <footer>Built with PLaMo.</footer>
    </main>
  </body>
</html>
